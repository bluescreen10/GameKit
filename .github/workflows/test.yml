name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mesa-vulkan:
    name: Mesa lavapipe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      GAMEKIT_GPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      XDG_RUNTIME_DIR: /tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Mesa Vulkan software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan-dev libx11-dev mesa-vulkan-drivers vulkan-tools xauth xvfb

      - name: Select lavapipe ICD
        run: |
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Verify lavapipe
        run: vulkaninfo --summary

      - name: Test
        run: xvfb-run -a go test ./... -count=1 -v
