name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"
      GAMEKIT_GPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      XDG_RUNTIME_DIR: /tmp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Mesa Vulkan software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan-dev libx11-dev mesa-vulkan-drivers vulkan-tools xauth xvfb

      - name: Select lavapipe ICD
        run: |
          lavapipe_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$lavapipe_icd"
          echo "VK_DRIVER_FILES=$lavapipe_icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$lavapipe_icd" >> "$GITHUB_ENV"

      - name: Verify lavapipe
        run: vulkaninfo --summary

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The no-cgo build compiles the *_unsupported.go stubs, which every real platform
      # excludes by build tag — so nothing else here ever compiles them.
      - name: Build and vet without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...

      # xvfb supplies the X display the window and input code needs; without it every
      # X11 path fails at XOpenDisplay rather than being tested.
      - name: Test
        run: xvfb-run -a go test ./... -count=1 -v

  macos:
    name: macOS
    # Pinned rather than macos-latest: KosmicKrisp is Apple Silicon only, and a runner
    # image that quietly moved back to x86_64 would fail as if the driver were broken.
    runs-on: macos-15
    # The SDK download is ~376 MB, so this job needs more headroom than the others.
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      # Vulkan-on-Metal through KosmicKrisp, which is the combination this engine
      # actually ships on. Switch to "metal" if the driver proves unstable on runners.
      GAMEKIT_GPU_BACKEND: vulkan
      # Pinned rather than "latest" so a CI failure is always reproducible, and so this
      # matches the SDK used in development.
      VULKAN_SDK_VERSION: 1.4.357.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # KosmicKrisp is Mesa's Vulkan-on-Metal driver and ships only inside the LunarG
      # SDK, as the com.lunarg.vulkan.kosmic component. com.lunarg.vulkan.usr is what
      # copies headers, the loader and the ICD manifests into /usr/local — which is
      # exactly where gpu/vulkan's #cgo darwin flags already look, so nothing here has
      # to override them.
      - name: Install the Vulkan SDK with KosmicKrisp
        run: |
          ver="$VULKAN_SDK_VERSION"
          curl -sSfL -o vulkansdk.zip \
            "https://sdk.lunarg.com/sdk/download/${ver}/mac/vulkansdk-macos-${ver}.zip"
          unzip -q vulkansdk.zip -d vulkansdk
          # The installer lives inside an .app bundle whose name carries the version;
          # find it rather than hardcoding a path that changes every release.
          installer="$(find vulkansdk -type f -path '*/Contents/MacOS/vulkansdk-macOS-*' -print -quit)"
          test -n "$installer" || { echo "installer not found in the SDK archive"; exit 1; }
          sudo "$installer" \
            --root "$HOME/VulkanSDK/${ver}" \
            --accept-licenses --accept-messages --default-answer --confirm-command \
            install com.lunarg.vulkan.core com.lunarg.vulkan.usr com.lunarg.vulkan.kosmic

      - name: Select KosmicKrisp
        run: |
          icd=/usr/local/share/vulkan/icd.d/libkosmickrisp_icd.json
          test -f "$icd" || { echo "KosmicKrisp ICD missing — did com.lunarg.vulkan.kosmic install?"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # Fail here, with a readable device list, rather than inside an opaque test error
      # if the driver did not load.
      - name: Verify KosmicKrisp is the active driver
        run: |
          vulkaninfo --summary | sed -n '/^Devices:/,$p' | head -20
          vulkaninfo --summary | grep -q "KosmicKrisp" || { echo "KosmicKrisp is not the active driver"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Cocoa needs a WindowServer connection to create a window at all, which the
      # hosted macOS runners have.
      - name: Test
        run: go test ./... -count=1 -v

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cgo needs a C toolchain; the hosted image ships mingw-w64. Fail loudly here
      # rather than inside an opaque cgo build error.
      - name: Verify the C toolchain
        run: gcc --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # No Vulkan driver is present, so no backend registers and the gpu tests skip
      # themselves. What this job covers is the Win32 window and input code, which is
      # otherwise compiled nowhere.
      - name: Test
        run: go test ./... -count=1 -v
